name: gfx906 release

# Publishes the GitHub Release of a fork version tag: v<upstream version>+<fork version>-gfx906, for example
# v0.2.8+0.1-gfx906. docker/gfx906/release.sh on the MI50 box pushes the image to ghcr.io and then the tag; this job
# checks the tag against the tagged commit (its upstream part must be the app version it is built on, and the tag must
# come after every earlier one: a higher fork version, or the same one on a newer upstream) and writes the notes with
# docker/gfx906/release_notes.py.

on:
  push:
    tags: ['v*-gfx906']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: python3 docker/gfx906/release_notes.py check "$TAG"
      - name: The tag's commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Write the notes
        env:
          TAG: ${{ github.ref_name }}
        run: python3 docker/gfx906/release_notes.py notes "$TAG" > notes.md && cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
